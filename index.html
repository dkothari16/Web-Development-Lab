<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <header>
            <h1>Student Expense Tracker</h1>
        </header>

        <div class="total-box">
            <h2>Total Expenses</h2>
            <h1 id="totalAmount">₹0.00</h1>
        </div>

        <div>
            <h2>Add New Expense</h2>
            <form>
                <label for="expense-name">Expense Name:</label>
                <input type="text" id="expense-name" name="expense-name" required>
                <br>
                <br>
                <label for="expense-amount">Amount:</label>
                <input type="number" id="expense-amount" name="expense-amount" step="0.01" required>
                <br>
                <br>
                <select id="expense-category" name="expense-category" required>
                    <option value="">Select Category</option>
                    <option value="food">Food</option>
                    <option value="travel">Travel</option>
                    <option value="shopping">Shopping</option>
                    <option value="education">Education</option>
                    <option value="other">Other</option>
                </select>
                <br>
                <br>
                <button type="submit">Add Expense</button>
            </form>
        </div>

        <div>
            <h2>Your Expenses</h2>
            <ul id="expense-list"></ul>
        </div>

        <section class="panel">
            <div class="list-header">
                <div class="filter-group">
                    <label for="filter">Filter by category</label>
                    <select id="filter">
                        <option value="All">All</option>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Education">Education</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <br>
                <div class="total">
                    <span class="total-label">Total spent</span>
                    <span class="total-amount" id="total">₹0.00</span>
                </div>
            </div>
        </section>

    </div>

    <script src="server.js"></script>
</body>
</html>
